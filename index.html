
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MArts | Handcrafted Pottery &amp; Statues</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="description" content="MArts - Handcrafted Pottery &amp; Statues. Exquisite artisanal terracotta pots, ceramic vases, hand-carved stone and brass sculptures, and heritage home decor.">
  <meta property="og:title" content="MArts | Handcrafted Pottery &amp; Statues">
  <meta property="og:description" content="MArts - Handcrafted Pottery &amp; Statues. Exquisite artisanal terracotta pots, ceramic vases, hand-carved stone and brass sculptures, and heritage home decor.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #964328;
      --brand-primary-container: #b55b3d;
      --brand-secondary: #58624a;
      --brand-surface: #fff8f6;
      --brand-surface-container: #f6ecea;
      --brand-surface-low: #fcf1ef;
      --brand-on-surface: #1f1b1a;
      --brand-terracotta: #C85A32;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #fff8f6;
      color: #1f1b1a;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0px;
      height: 0px;
    }
    body {
      overflow-x: hidden; /* Prevent horizontal scroll only at the outermost level */
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    button, a, input, select, textarea, [role="button"] {
      touch-action: manipulation;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }

    @keyframes slideInFromRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .slide-in-from-right {
      animation: slideInFromRight 0.3s ease-out forwards;
    }

    @keyframes slideInFromLeft {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .slide-in-from-left {
      animation: slideInFromLeft 0.3s ease-out forwards;
    }
    
    .bg-brand { background-color: var(--brand-orange); }
    .text-brand { color: var(--brand-orange); }
    .border-brand { border-color: var(--brand-orange); }
    
    /* Prevent input placeholders from animating or transitioning during loading or font rendering */
    input::placeholder,
    textarea::placeholder,
    ::-webkit-input-placeholder,
    ::-moz-placeholder,
    :-ms-input-placeholder {
      transition: none !important;
      -webkit-transition: none !important;
      animation: none !important;
      -webkit-animation: none !important;
    }

    /* Smooth transitions for sticky header shadow */
    header {
      transition: box-shadow 0.3s ease, background-color 0.3s ease;
    }
  </style>
</head>
<body class="selection:bg-[#F2E4D8] selection:text-[#2B221B]">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
